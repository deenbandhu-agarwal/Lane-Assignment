# docker compose up            -> run the database on http://localhost:8080
# docker compose run --rm test -> run the whole test suite (offline)
# docker compose run --rm bench -> run the benchmark, report in ./bench/out/results.md
services:
  tsdb:
    build: .
    ports:
      - "8080:8080"
    environment:
      TSDB_DATA_DIR: /data
    volumes:
      - tsdb-data:/data

  test:
    build: .
    profiles: ["test"]
    command: ["uv", "run", "--frozen", "--no-sync", "pytest", "-q"]
    network_mode: none

  bench:
    build: .
    profiles: ["bench"]
    command: ["uv", "run", "--frozen", "--no-sync", "python", "bench/run.py", "--out", "bench/out/results.md"]
    volumes:
      - ./bench/out:/app/bench/out

volumes:
  tsdb-data:
