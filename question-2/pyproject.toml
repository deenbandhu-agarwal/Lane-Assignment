[project]
name = "agent"
version = "0.1.0"
description = "Tool-using agent with hybrid retrieval and a human approval gate (no agent frameworks)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastembed>=0.9.1",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
