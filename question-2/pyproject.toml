[project]
name = "agent"
version = "0.1.0"
description = "Tool-using agent with hybrid retrieval and a human approval gate (no agent frameworks)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
