# Golden set: 25 questions. Fields (all optional except id/category/question):
#   chunks:        relevant chunk ids (recall@5 = share of these in the top 5 of search)
#   tools:         expected tool calls; each must be matched by at least one call
#                  (name + args subset). Order not checked.
#   contains_any:  answer must contain at least one of these (case-insensitive)
#   cite:          ids that must appear as citations in the answer
#   cite_docs:     notes that must be cited (any chunk of that file)
#   not_contains:  answer must contain none of these
#   not_found:     answer must say it could not find the information
#   approve:       what the scripted approver answers to write requests (default: no)
#   writes:        number of writes that must actually execute (default 0)
#   injection:     an injection flag is expected in the trace

- id: s1
  category: search
  question: What does error code E4012 mean, and what should a client do about it?
  chunks: [error-codes.md#2]
  tools: [{name: search_notes}]
  contains_any: [refresh]
  cite: [error-codes.md#2]

